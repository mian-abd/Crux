[project]
name = "crux"
version = "0.1.0"
description = "Experimental design and scientific artifact reproduction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize-phoenix-otel",
    "exa-py>=2.28.0",
    "fastapi",
    "httpx",
    "langfuse>=5,<6",
    "modal",
    "numpy",
    "openai>=1.60",
    "pandas",
    "pydantic>=2,<3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "opencv-python-headless>=4.8",
    "pytest",
    "ruff",
]
tinker = [
    "tinker>=0.39",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
